<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 세계관 설정집 (Pro + Cloud 연동)</title>
    <style>
        /* --- 기존 V5의 완벽한 디자인 그대로 유지 --- */
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; display: flex; background-color: #f4f6f9; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background-color: #1e2b3c; color: #ecf0f1; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; background-color: #141d28; font-size: 1.2rem; font-weight: bold; text-align: center; border-bottom: 1px solid #2c3e50; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px; }
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .menu-btn { padding: 12px; background-color: #34495e; border-radius: 6px; cursor: pointer; margin-bottom: 15px; text-align: center; font-weight: bold; transition: 0.2s; }
        .menu-btn:hover { background-color: #415b76; }
        .region-group { margin-bottom: 20px; }
        .region-title { font-size: 1.05rem; font-weight: bold; color: #f1c40f; border-bottom: 1px solid #34495e; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .add-btn { background: #27ae60; color: white; border: none; border-radius: 4px; width: 24px; height: 24px; cursor: pointer; font-weight: bold; line-height: 24px; text-align: center; }
        .folder-group { margin-bottom: 8px; border-radius: 6px; padding-bottom: 5px; transition: background-color 0.2s; }
        .folder-group.drag-over { background-color: rgba(52, 152, 219, 0.2); outline: 2px dashed #3498db; }
        .folder-title { font-size: 0.95rem; color: #bdc3c7; margin: 5px 0 5px 5px; font-weight: bold; padding: 8px; cursor: pointer; user-select: none; border-radius: 4px; transition: 0.2s; }
        .folder-title:hover { background-color: #2c3e50; color: #f1c40f; }
        .folder-items { display: block; list-style: none; padding: 0; margin: 0; }
        .folder-group.collapsed .folder-items { display: none; }
        .char-item { padding: 8px 10px 8px 25px; cursor: grab; border-radius: 4px; font-size: 0.95rem; color: #ecf0f1; transition: 0.2s; margin-bottom: 2px; position: relative; }
        .char-item:active { cursor: grabbing; }
        .char-item:hover { background-color: #2c3e50; }
        .char-item.active { background-color: #3498db; color: white; font-weight: bold; }
        .char-item.drag-over-item { border-top: 3px solid #f1c40f; background-color: #2c3e50; }
        
        .main-content { flex: 1; padding: 40px; overflow-y: auto; background-color: #ffffff; position: relative; }
        .section { display: none; animation: fadeIn 0.4s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .map-container { width: 100%; height: 70vh; background-color: #e0e0e0; border: 3px dashed #bdc3c7; border-radius: 12px; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; margin-bottom: 20px; }
        .map-container img { width: 100%; height: 100%; object-fit: contain; position: absolute; z-index: 1; display: none; }
        .map-container span { z-index: 0; color: #7f8c8d; font-size: 1.5rem; font-weight: bold; text-align: center; pointer-events: none; }
        .map-container input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }

        .view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; }
        .view-header h2 { margin: 0; color: #2c3e50; font-size: 1.8rem; }
        .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }

        .image-upload-area { display: flex; gap: 30px; margin-bottom: 40px; justify-content: center; flex-wrap: wrap; }
        .image-box { width: 400px; height: 550px; border: 2px dashed #bdc3c7; border-radius: 12px; position: relative; overflow: hidden; background-color: #fafafa; display: flex; align-items: center; justify-content: center; text-align: center; color: #95a5a6; transition: 0.3s; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none; z-index: 1; }
        .image-box span { font-size: 1.1rem; font-weight: bold; line-height: 1.4; padding: 20px; }
        .image-box input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-weight: bold; margin-bottom: 8px; color: #34495e; font-size: 0.95rem; }
        .input-group input, .input-group textarea { padding: 12px; border: 1px solid #dcdde1; border-radius: 6px; font-family: inherit; font-size: 1rem; }
        .input-group textarea { resize: vertical; height: 120px; }
        .full-width { grid-column: 1 / -1; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: #2ecc71; color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
        
        /* 로딩 화면 */
        .loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.9); display:flex; justify-content:center; align-items:center; z-index:9999; font-weight:bold; font-size: 1.2rem; color: #2c3e50; }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">☁️ 클라우드 저장소에서 세계관을 불러오는 중...</div>

    <aside class="sidebar">
        <div class="sidebar-header">🧭 WORLD WIKI</div>
        <div class="sidebar-content" id="sidebar-content"></div>
    </aside>

    <main class="main-content">
        <div id="toast" class="toast">💾 클라우드에 자동 저장되었습니다</div>

        <!-- 맵 뷰 -->
        <div id="view-map" class="section active">
            <h2>🗺️ 세계관 전체 지도</h2>
            <div class="map-container">
                <span>클릭하거나<br>맵 이미지를 드롭하세요</span>
                <img id="map-img" src="">
                <input type="file" accept="image/*" onchange="uploadImage(this, 'mapImg')">
            </div>
        </div>

        <!-- 캐릭터 뷰 -->
        <div id="view-char" class="section">
            <div class="view-header">
                <h2 id="view-region-title">지역 이름</h2>
                <button class="delete-btn" onclick="deleteCurrentChar()">🗑️ 이 캐릭터 삭제</button>
            </div>

            <div class="image-upload-area">
                <div class="image-box">
                    <span>클릭하여<br>캐릭터 이미지 삽입</span>
                    <img id="char-imgChar" src="">
                    <input type="file" accept="image/*" onchange="uploadImage(this, 'imgChar')">
                </div>
                <div class="image-box">
                    <span>클릭하여<br>모티브 이미지 삽입</span>
                    <img id="char-imgMotif" src="">
                    <input type="file" accept="image/*" onchange="uploadImage(this, 'imgMotif')">
                </div>
            </div>

            <div class="info-grid">
                <div class="input-group"><label>이름 (수정 시 목차 자동 반영)</label><input type="text" id="char-name" oninput="updateChar('name', this.value)"></div>
                <div class="input-group"><label>폴더 (묶을 그룹명 입력, 드래그 이동 가능)</label><input type="text" id="char-folder" oninput="updateChar('folder', this.value)"></div>
                <div class="input-group"><label>소속</label><input type="text" id="char-belong" oninput="updateChar('belong', this.value)"></div>
                <div class="input-group"><label>성격</label><input type="text" id="char-personality" oninput="updateChar('personality', this.value)"></div>
                <div class="input-group"><label>퍼스널 컬러</label><input type="text" id="char-color" oninput="updateChar('color', this.value)"></div>
                <div class="input-group"><label>무기</label><input type="text" id="char-weapon" oninput="updateChar('weapon', this.value)"></div>
                <div class="input-group"><label>능력</label><input type="text" id="char-ability" oninput="updateChar('ability', this.value)"></div>
                <div class="input-group"><label>좋아하는 것</label><input type="text" id="char-like" oninput="updateChar('like', this.value)"></div>
                <div class="input-group"><label>싫어하는 것</label><input type="text" id="char-hate" oninput="updateChar('hate', this.value)"></div>
                <div class="input-group full-width"><label>모티브</label><input type="text" id="char-motif" oninput="updateChar('motif', this.value)"></div>
                <div class="input-group full-width"><label>목표</label><textarea id="char-goal" oninput="updateChar('goal', this.value)"></textarea></div>
                <div class="input-group full-width"><label>결핍</label><textarea id="char-deficiency" oninput="updateChar('deficiency', this.value)"></textarea></div>
                <div class="input-group full-width"><label>디자인 요소</label><textarea id="char-design" oninput="updateChar('design', this.value)"></textarea></div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK 로드 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 재환님의 파이어베이스 열쇠
        const firebaseConfig = {
            apiKey: "AIzaSyCXgVRpA0rK15z_k7I6RoFlvBNsm2PGUqQ",
            authDomain: "myworldwiki-d5e01.firebaseapp.com",
            projectId: "myworldwiki-d5e01",
            storageBucket: "myworldwiki-d5e01.firebasestorage.app",
            messagingSenderId: "786890733631",
            appId: "1:786890733631:web:b66c4fb509f17dc9b8e08a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "worldData", "mainData");

        const regionsInfo = { sephiroth: "🌳 세피로트 아르카", neon: "✨ 네온아크", rufus: "🐾 루퍼스" };
        let appData = { mapImg: "", characters: [], collapsedFolders: {} };
        let activeCharId = null;
        let draggedCharId = null;

        // --- 1. 실시간 클라우드 동기화 ---
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                appData = docSnap.data();
                if (!appData.characters) appData.characters = [];
                if (!appData.collapsedFolders) appData.collapsedFolders = {};
                
                // 맵 이미지 복원
                if (appData.mapImg) {
                    document.getElementById('map-img').src = appData.mapImg;
                    document.getElementById('map-img').style.display = 'block';
                }
                renderSidebar();
            }
            document.getElementById('loading').style.display = 'none'; // 로딩 끝
        });

        // --- 2. 클라우드 저장 (요금제 보호용 디바운스 적용) ---
        let saveTimeout;
        window.saveData = function() {
            clearTimeout(saveTimeout);
            // 타이핑 멈추고 0.5초 뒤에만 서버로 전송 (무료 요금제 아끼기)
            saveTimeout = setTimeout(async () => {
                await setDoc(docRef, appData);
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 1500);
            }, 500);
        };

        // --- 3. UI 및 사이드바 렌더링 (드래그, 폴더 접기 복구) ---
        window.renderSidebar = function() {
            const sidebar = document.getElementById('sidebar-content');
            let html = `<div class="menu-btn" onclick="showMap()">🗺️ 전체 지도 보기</div>`;

            for (const [regKey, regName] of Object.entries(regionsInfo)) {
                html += `<div class="region-group"><div class="region-title"><span>${regName}</span><button class="add-btn" onclick="createNewChar('${regKey}')">+</button></div>`;
                
                let charsInRegion = appData.characters.filter(c => c.region === regKey);
                let folders = {};
                charsInRegion.forEach(c => {
                    let folderName = c.folder ? c.folder : '미분류';
                    if(!folders[folderName]) folders[folderName] = [];
                    folders[folderName].push(c);
                });

                for (const [fName, chars] of Object.entries(folders)) {
                    const folderKey = `${regKey}-${fName}`;
                    const isCollapsed = appData.collapsedFolders[folderKey];
                    const collapsedClass = isCollapsed ? 'collapsed' : '';
                    const icon = isCollapsed ? '▶' : '▼';

                    html += `<div class="folder-group ${collapsedClass}" ondragover="handleDragOverFolder(event)" ondragleave="handleDragLeaveFolder(event)" ondrop="handleDropOnFolder(event, '${regKey}', '${fName}')">
                                <div class="folder-title" onclick="toggleFolder('${regKey}', '${fName}')">${icon} 📁 ${fName}</div>
                                <ul class="folder-items">`;
                    
                    chars.forEach(c => {
                        let activeClass = (c.id === activeCharId) ? 'active' : '';
                        let displayName = c.name ? c.name : '이름 없음';
                        html += `<li class="char-item ${activeClass}" draggable="true" onclick="openCharView(${c.id})" ondragstart="handleDragStart(event, ${c.id})" ondragover="handleDragOverItem(event)" ondragleave="handleDragLeaveItem(event)" ondrop="handleDropOnItem(event, ${c.id})">↳ ${displayName}</li>`;
                    });
                    html += `</ul></div>`;
                }
                html += `</div>`;
            }
            sidebar.innerHTML = html;
        };

        window.toggleFolder = function(regionKey, folderName) {
            const folderKey = `${regionKey}-${folderName}`;
            appData.collapsedFolders[folderKey] = !appData.collapsedFolders[folderKey];
            saveData(); renderSidebar();
        };

        // --- 4. 드래그 앤 드롭 로직 복구 ---
        window.handleDragStart = function(e, id) { draggedCharId = id; setTimeout(() => e.target.style.opacity = '0.5', 0); };
        window.handleDragOverItem = function(e) { e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.add('drag-over-item'); };
        window.handleDragLeaveItem = function(e) { e.currentTarget.classList.remove('drag-over-item'); };
        window.handleDragOverFolder = function(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
        window.handleDragLeaveFolder = function(e) { e.currentTarget.classList.remove('drag-over'); };
        
        window.handleDropOnItem = function(e, targetId) {
            e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.remove('drag-over-item');
            if (draggedCharId === targetId) return;
            const draggedIndex = appData.characters.findIndex(c => c.id === draggedCharId);
            let targetIndex = appData.characters.findIndex(c => c.id === targetId);
            if (draggedIndex === -1 || targetIndex === -1) return;
            
            const draggedChar = appData.characters[draggedIndex];
            const targetChar = appData.characters[targetIndex];
            draggedChar.region = targetChar.region; draggedChar.folder = targetChar.folder;
            appData.collapsedFolders[`${targetChar.region}-${targetChar.folder}`] = false;

            appData.characters.splice(draggedIndex, 1);
            targetIndex = appData.characters.findIndex(c => c.id === targetId);
            appData.characters.splice(targetIndex, 0, draggedChar);
            saveData(); renderSidebar(); syncFormIfActive(draggedChar);
        };

        window.handleDropOnFolder = function(e, region, folderName) {
            e.preventDefault(); e.currentTarget.classList.remove('drag-over');
            if (!draggedCharId) return;
            const draggedIndex = appData.characters.findIndex(c => c.id === draggedCharId);
            if (draggedIndex === -1) return;
            
            const draggedChar = appData.characters[draggedIndex];
            draggedChar.region = region; draggedChar.folder = folderName;
            appData.collapsedFolders[`${region}-${folderName}`] = false;

            appData.characters.splice(draggedIndex, 1); appData.characters.push(draggedChar);
            saveData(); renderSidebar(); syncFormIfActive(draggedChar);
        };

        window.syncFormIfActive = function(draggedChar) { 
            if (activeCharId === draggedCharId) { 
                document.getElementById('char-folder').value = draggedChar.folder; 
                document.getElementById('view-region-title').innerText = regionsInfo[draggedChar.region]; 
            } 
            draggedCharId = null; 
        };

        // --- 5. 데이터 입력 및 뷰 관리 ---
        window.showMap = function() { activeCharId = null; document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById('view-map').classList.add('active'); renderSidebar(); };
        window.createNewChar = function(regionKey) {
            const newChar = { id: Date.now(), region: regionKey, folder: '기본 폴더', name: '새 캐릭터', belong: '', personality: '', color: '', weapon: '', ability: '', like: '', hate: '', motif: '', goal: '', deficiency: '', design: '', imgChar: '', imgMotif: '' };
            appData.characters.push(newChar); saveData(); openCharView(newChar.id);
        };
        
        window.openCharView = function(id) {
            activeCharId = id; const char = appData.characters.find(c => c.id === id); if(!char) return;
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById('view-char').classList.add('active');
            document.getElementById('view-region-title').innerText = regionsInfo[char.region];
            
            const fields = ['name', 'folder', 'belong', 'personality', 'color', 'weapon', 'ability', 'like', 'hate', 'motif', 'goal', 'deficiency', 'design'];
            fields.forEach(f => { document.getElementById(`char-${f}`).value = char[f] || ''; });
            
            document.getElementById('char-imgChar').src = char.imgChar; document.getElementById('char-imgChar').style.display = char.imgChar ? 'block' : 'none';
            document.getElementById('char-imgMotif').src = char.imgMotif; document.getElementById('char-imgMotif').style.display = char.imgMotif ? 'block' : 'none';
            renderSidebar();
        };

        window.updateChar = function(key, value) { 
            if(!activeCharId) return; 
            const char = appData.characters.find(c => c.id === activeCharId); 
            if(char) { 
                char[key] = value; 
                saveData(); 
                if(key === 'name' || key === 'folder') renderSidebar(); 
            } 
        };

        window.deleteCurrentChar = function() { 
            if(!activeCharId) return; 
            if(confirm("정말로 이 캐릭터를 삭제하시겠습니까?")) { 
                appData.characters = appData.characters.filter(c => c.id !== activeCharId); 
                saveData(); showMap(); 
            } 
        };

        // --- 6. 고화질 이미지 리사이징 (복구됨) ---
        window.uploadImage = function(input, type) {
            if (!input.files || !input.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    const maxSize = 1600; 
                    if (w > maxSize || h > maxSize) {
                        if (w > h) { h = Math.round((h * maxSize) / w); w = maxSize; } 
                        else { w = Math.round((w * maxSize) / h); h = maxSize; }
                    }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);

                    if (type === 'mapImg') {
                        appData.mapImg = compressedDataUrl;
                        document.getElementById('map-img').src = compressedDataUrl;
                        document.getElementById('map-img').style.display = 'block';
                    } else if (activeCharId) {
                        const char = appData.characters.find(c => c.id === activeCharId);
                        char[type] = compressedDataUrl;
                        document.getElementById(`char-${type}`).src = compressedDataUrl;
                        document.getElementById(`char-${type}`).style.display = 'block';
                    }
                    saveData();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        };
    </script>
</body>
</html>
